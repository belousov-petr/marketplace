name: sync-plugins

# Keep this catalog's vendored Codex packages + Claude version labels in step with the
# source repos, so Claude Code and Codex consumers auto-update. Sources are PUBLIC, so the
# default GITHUB_TOKEN checks them out — no read tokens needed.
#
# Generalized from the original single-strata sync so the catalog can grow to many plugins:
# add a checkout step per new source and a vendor line in sync-plugins.sh.
#
# Schedule = catch-all; workflow_dispatch = instant sync; repository_dispatch is fired by a
# source repo's notify-marketplace.yml on a release tag (event type: plugin-released).
#
# GitHub disables a public repo's scheduled workflows after 60 days with no repository
# activity, and a sync run that finds nothing to do commits nothing — so a quiet catalog
# reads as an abandoned one. That is what parked this workflow on 2026-09-10 (last push
# 2026-07-12, exactly 60 days). The keepalive step below pushes an empty commit once the
# newest commit passes 50 days, which resets the timer with 10 days to spare.

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch:
    inputs:
      force_keepalive:
        description: "Run the keepalive commit regardless of age (verifies KEEPALIVE_PAT still works)"
        type: boolean
        default: false
  repository_dispatch:
    types: [plugin-released]

permissions:
  contents: write

concurrency:
  group: sync-plugins
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout marketplace
        uses: actions/checkout@v5

      - name: Checkout strata (public)
        uses: actions/checkout@v5
        with:
          repository: belousov-petr/strata
          ref: main
          path: src/strata

      - name: Sync packages into the catalog
        run: bash ./sync-plugins.sh ./src/strata

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- plugins .claude-plugin/marketplace.json)" ]; then
            echo "Catalog already matches sources — nothing to sync."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- plugins .claude-plugin/marketplace.json
          git commit -m "sync: re-vendor packages + bump catalog labels"
          git push
          echo "Synced catalog."

      # Pushes with KEEPALIVE_PAT, not GITHUB_TOKEN: GitHub never documents what counts as
      # "repository activity", so this deliberately does not rely on a bot push resetting the
      # timer. Fails the run on a missing/expired token rather than skipping quietly — a silent
      # keepalive is worse than none, since the repo goes dark again 60 days later.
      - name: Keepalive (reset GitHub's 60-day inactivity timer)
        env:
          KEEPALIVE_PAT: ${{ secrets.KEEPALIVE_PAT }}
          FORCE: ${{ inputs.force_keepalive }}
        run: |
          set -euo pipefail
          if [ -z "${KEEPALIVE_PAT}" ]; then
            echo "::error::KEEPALIVE_PAT is missing or empty — cannot hold the schedule open."
            exit 1
          fi
          age_days=$(( ( $(date -u +%s) - $(git log -1 --format=%ct HEAD) ) / 86400 ))
          echo "Newest commit on main is ${age_days} day(s) old."
          if [ "${FORCE}" != "true" ] && [ "${age_days}" -lt 50 ]; then
            echo "Under the 50-day threshold — no keepalive needed."
            exit 0
          fi
          git config user.name  "belousov-petr"
          git config user.email "265922117+belousov-petr@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive (reset GitHub's 60-day inactivity timer)"
          git push "https://x-access-token:${KEEPALIVE_PAT}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          echo "Keepalive pushed — the 60-day clock restarts today."
