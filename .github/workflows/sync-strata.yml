name: sync-strata

# Keep this catalog in step with the strata repo so Claude Code and Codex consumers
# auto-update. Re-vendors strata via sync-strata.sh and pushes if anything changed.
# Runs on a schedule (catch-all) and on demand ("Run workflow" = instant sync).
#
# Requires: repo Settings -> Actions -> General -> Workflow permissions set to
# "Read and write permissions" (so GITHUB_TOKEN can push the sync commit).

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch: {} # manual button for an instant sync after a release
  repository_dispatch: # fired by belousov-petr/strata on a release tag (instant)
    types: [strata-released]

permissions:
  contents: write

concurrency:
  group: sync-strata
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout marketplace
        uses: actions/checkout@v4

      - name: Checkout strata (main)
        uses: actions/checkout@v4
        with:
          repository: belousov-petr/strata
          ref: main
          path: strata-src

      - name: Sync strata into the catalog
        run: bash ./sync-strata.sh ./strata-src

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- plugins/strata .claude-plugin/marketplace.json)" ]; then
            echo "Catalog already matches strata main — nothing to sync."
            exit 0
          fi
          version="$(grep -m1 '"version"' strata-src/.claude-plugin/plugin.json \
            | sed -E 's/.*"([0-9][^"]*)".*/\1/')"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- plugins/strata .claude-plugin/marketplace.json
          git commit -m "strata: auto-sync to ${version}"
          git push
          echo "Synced catalog to strata ${version}."
